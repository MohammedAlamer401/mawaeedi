name: mawaeedi
description: "مواعيدي - تنظيم المواعيد الشخصية"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.2
  flutter_timezone: ^5.1.1
  go_router: ^18.1.3
  intl: ^0.20.2
  path: ^1.9.1
  shared_preferences: ^2.5.6
  sqflite: ^2.4.5
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  sqflite_common_ffi: ^2.4.5

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/brand/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Variable.ttf

# أيقونة التطبيق: flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/app_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: assets/brand/app_icon_background.png
  adaptive_icon_foreground: assets/brand/app_icon_foreground.png
  min_sdk_android: 23

# خلفية شاشة الإقلاع الأصلية بلون التطبيق حتى لا تومض شاشة بيضاء
flutter_native_splash:
  color: "#F5F8FF"
  color_dark: "#0E1524"
  android_12:
    color: "#F5F8FF"
    color_dark: "#0E1524"
