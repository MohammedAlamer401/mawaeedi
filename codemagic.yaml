# Codemagic CI/CD — https://codemagic.io
#
# - android-apk: يعمل تلقائياً مع كل push على main: تحليل واختبارات ثم APK للتجربة.
# - ios-unsigned: يدوي، ويُخرج IPA غير موقّع (يُثبَّت بعد إعادة توقيعه عبر Sideloadly أو AltStore).
# - ios-testflight: يدوي، ويحتاج حساب Apple Developer وربط مفتاح App Store Connect
#   في Codemagic (Teams → Integrations) باسم "Mawaeedi ASC".

definitions:
  environment: &env
    flutter: 3.44.6
  scripts:
    - &get_packages
      name: Get packages
      script: flutter pub get
    - &analyze
      name: Analyze
      script: flutter analyze --no-fatal-infos
    - &test
      name: Unit tests
      script: flutter test test/

workflows:
  android-apk:
    name: Android APK
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      <<: *env
      java: 17
    triggering:
      events: [push]
      branch_patterns:
        - pattern: main
    scripts:
      - *get_packages
      - *analyze
      - *test
      - name: Build APKs
        script: |
          flutter build apk --release --build-number=$PROJECT_BUILD_NUMBER
          flutter build apk --release --split-per-abi --build-number=$PROJECT_BUILD_NUMBER
      # نفس تسمية «نسبتي»: mawaeedi-<الإصدار>-<رقم البناء>[-المعمارية].apk
      - name: Rename APKs
        script: |
          cd build/app/outputs/flutter-apk
          V=$(grep '^version:' $CM_BUILD_DIR/pubspec.yaml | sed 's/version: //; s/+.*//')
          N=$PROJECT_BUILD_NUMBER
          mv app-release.apk "mawaeedi-$V-$N.apk"
          mv app-arm64-v8a-release.apk "mawaeedi-$V-$N-arm64.apk"
          mv app-armeabi-v7a-release.apk "mawaeedi-$V-$N-armv7.apk"
    artifacts:
      - build/app/outputs/flutter-apk/mawaeedi-*.apk

  ios-unsigned:
    name: iOS build check (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      <<: *env
      xcode: latest
      cocoapods: default
    scripts:
      - *get_packages
      - *analyze
      - *test
      - name: Build iOS (no codesign)
        script: flutter build ios --release --no-codesign --build-number=$PROJECT_BUILD_NUMBER
      - name: Package unsigned IPA
        script: |
          cd build/ios/iphoneos
          rm -rf Payload && mkdir Payload
          cp -R Runner.app Payload/
          zip -qry "mawaeedi-$PROJECT_BUILD_NUMBER-unsigned.ipa" Payload
    artifacts:
      - build/ios/iphoneos/*.ipa

  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Mawaeedi ASC
    environment:
      <<: *env
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mawaeedi.mawaeedi
    scripts:
      - *get_packages
      - *test
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Install pods
        script: find . -name "Podfile" -execdir pod install \;
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --build-number=$PROJECT_BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
